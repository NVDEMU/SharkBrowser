name: Build Shark Browser
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact-path: dist/*.exe
          - os: macos-latest
            script: dist:mac
            artifact-path: |
              dist/*.dmg
              dist/*.zip
          - os: ubuntu-latest
            script: dist:linux
            artifact-path: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Validate JavaScript syntax
        run: npm run check
      - name: Run filter engine tests
        run: npm test
      - name: Build application
        run: npm run ${{ matrix.script }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SharkBrowser-${{ matrix.os }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact-path }}
